<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mariana IA — Asistente Virtual de Trasteos Ya</title>
<meta name="description" content="Cotiza tu mudanza por voz con Mariana, la asistente virtual de Trasteos Ya. Atencion inmediata. Bogota y toda Colombia.">
<meta name="theme-color" content="#050E2D">
<link rel="canonical" href="https://trasteosya.online/voice-agent.html">
<link rel="icon" href="assets/img/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#050E2D;color:#fff;height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden;position:relative}

:root{
  --navy:#050E2D;--brand:#003DA5;
  --text:#ffffff;--muted:#8a9cc4;--dim:#5a6d94;
  --border:rgba(255,255,255,0.12);--border-soft:rgba(255,255,255,0.08);
  --glow:rgba(255,255,255,0.06);
  --green:#22c55e;--red:#ef4444;
}

/* ── GRAIN ── */
.grain{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:180px}

/* ── AMBIENT ── */
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── PAGE GRID ── */
.page{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;min-height:100dvh}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:22px 40px 10px;z-index:50;position:relative}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;opacity:0;animation:inScale 1.05s cubic-bezier(.16,1,.3,1) .08s both}
.logo img{height:43px;filter:brightness(1.1)}
.logo span{font-size:15px;font-weight:600;color:#fff;letter-spacing:-.02em}
.powered{width:100%;text-align:center;margin-top:18px;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.01em;
  opacity:0;animation:inStat 1.05s cubic-bezier(.16,1,.3,1) 1.55s both}
.powered a{color:rgba(255,255,255,.45);text-decoration:none;font-weight:600}
.powered a:hover{color:rgba(255,255,255,.7)}

/* ── HERO ── */
.hero{display:flex;align-items:center;justify-content:center;padding:0 24px 60px;min-height:0}
.hero-copy{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:860px;width:100%}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:5px;margin-bottom:18px;
  background:linear-gradient(90deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 52%,rgba(0,61,165,.15) 100%);
  font-size:12px;font-weight:500;color:rgba(255,255,255,.85);letter-spacing:.01em;
  opacity:0;animation:inPop 1.05s cubic-bezier(.16,1,.3,1) .22s both}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* H1 */
.hero h1{font-size:clamp(2rem,5.5vw,3rem);font-weight:700;color:#fff;line-height:1.14;letter-spacing:-.04em;
  opacity:0;animation:inMask 1.05s cubic-bezier(.16,1,.3,1) .42s both;
  text-shadow:0 0 20px rgba(255,255,255,.25),0 0 60px rgba(255,255,255,.08);
  background:linear-gradient(90deg,#fff 0%,#fff 40%,rgba(200,220,255,.7) 50%,#fff 60%,#fff 100%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:inMask 1.05s cubic-bezier(.16,1,.3,1) .42s both,shimmer 4s ease-in-out 2s infinite}
@keyframes shimmer{0%,100%{background-position:100% 0}50%{background-position:-100% 0}}
.hero h1 em{font-style:italic;font-weight:300;-webkit-text-fill-color:var(--muted);letter-spacing:-.02em}

/* Lede */
.lede{max-width:420px;margin-top:16px;color:var(--muted);font-size:15px;font-weight:400;line-height:1.6;letter-spacing:-.01em;
  opacity:0;animation:inSoft 1.25s cubic-bezier(.16,1,.3,1) .72s both}

/* ── CALL WIDGET ── */
.call-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:32px;
  opacity:0;animation:inSoft 1.05s cubic-bezier(.16,1,.3,1) .86s both}

.orb-box{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center}

/* Orb rings with light trails */
.orb-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.04);transition:.5s;overflow:visible}
.orb-ring:nth-child(1){inset:-6px;animation:orbSpin 14s linear infinite}
.orb-ring:nth-child(2){inset:-18px;border-color:rgba(255,255,255,.03);animation:orbSpin 22s linear infinite reverse}
.orb-ring:nth-child(3){inset:-32px;border-color:rgba(255,255,255,.02);animation:orbSpin 30s linear infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
/* Lead dot */
.orb-ring::after{content:'';position:absolute;top:-2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.5),0 0 20px 4px rgba(200,220,255,.3)}
.orb-ring:nth-child(2)::after{top:auto;bottom:-2px;width:4px;height:4px;margin-left:-2px;
  background:rgba(255,255,255,.7);box-shadow:0 0 6px 2px rgba(255,255,255,.35),0 0 16px 3px rgba(200,220,255,.2)}
.orb-ring:nth-child(3)::after{left:-1px;top:50%;width:3px;height:3px;margin-left:0;
  background:rgba(255,255,255,.5);box-shadow:0 0 5px 1px rgba(255,255,255,.25),0 0 12px 2px rgba(200,220,255,.15)}
/* Light trail (comet tail) */
.orb-ring::before{content:'';position:absolute;top:-1px;left:50%;width:28px;height:2px;margin-left:-2px;border-radius:1px;
  background:linear-gradient(90deg,rgba(255,255,255,.4),transparent);transform-origin:left center;opacity:.7}
.orb-ring:nth-child(2)::before{top:auto;bottom:-1px;width:22px;height:2px;
  background:linear-gradient(90deg,rgba(255,255,255,.25),transparent);opacity:.5}
.orb-ring:nth-child(3)::before{left:-1px;top:50%;width:18px;height:1.5px;margin-left:0;
  background:linear-gradient(90deg,rgba(255,255,255,.15),transparent);opacity:.4}

/* Pulse ring */
.ring{position:absolute;inset:4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.06);transition:.4s}
.ring.active{border-color:rgba(255,255,255,.5);animation:ringP 1.5s ease-out infinite}
.ring.listening{border-color:var(--brand);animation:ringP 1s ease-out infinite}
@keyframes ringP{0%{transform:scale(1);opacity:1}100%{transform:scale(1.35);opacity:0}}

/* Glow */
.orb-glow{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);filter:blur(10px);transition:.5s}

/* Call button */
.call-btn{width:100px;height:100px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.3s;position:relative;z-index:1;outline:none;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.call-btn.idle{background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 100%);color:#fff;
  box-shadow:0 4px 30px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.12);
  animation:btnBreathe 3s ease-in-out infinite}
.call-btn.idle:hover{transform:scale(1.06);border-color:rgba(255,255,255,.25);
  box-shadow:0 8px 40px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.18)}
.call-btn.active{background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.06) 100%);color:#fff;
  animation:bPulse 2s infinite;border-color:rgba(255,255,255,.3)}
.call-btn.connecting{background:rgba(255,255,255,.03);color:var(--dim);pointer-events:none;border-color:rgba(255,255,255,.04)}
@keyframes bPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.2)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
@keyframes btnBreathe{0%,100%{box-shadow:0 0 18px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.12);border-color:rgba(255,255,255,.12)}50%{box-shadow:0 0 30px rgba(255,255,255,.15),inset 0 1px 0 rgba(255,255,255,.2);border-color:rgba(255,255,255,.25)}}
.call-btn svg{width:40px;height:40px;fill:currentColor}

.call-label{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.01em;margin-top:12px}
.call-status{font-size:11px;font-weight:500;color:var(--muted);min-height:16px;transition:.3s}
.call-status.active{color:rgba(255,255,255,.7)}
.call-status.listening{color:var(--brand)}

.timer{font-size:20px;font-weight:300;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;min-height:24px;letter-spacing:1.5px}

.vol-bar{width:140px;height:2px;background:rgba(255,255,255,.06);border-radius:1px;overflow:hidden}
.vol-fill{height:100%;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,.7));border-radius:1px;width:0%;transition:width .1s}
.vol-fill.speaking{background:linear-gradient(90deg,rgba(255,255,255,.5),#fff)}

/* ── TRANSCRIPT ── */
.transcript{width:100%;max-width:380px;max-height:140px;overflow-y:auto;margin-top:14px;text-align:left;padding:0 4px}
.transcript::-webkit-scrollbar{width:2px}
.transcript::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.msg{padding:7px 11px;margin-bottom:4px;border-radius:8px;font-size:12px;line-height:1.5;max-width:85%}
.msg.agent{background:rgba(255,255,255,.05);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.06)}
.msg.user{background:rgba(255,255,255,.08);color:#fff;margin-left:auto;text-align:right;border:1px solid rgba(255,255,255,.08)}
.msg.system{background:none;color:var(--dim);font-size:10px;text-align:center;max-width:100%}
.error-msg{background:rgba(239,68,68,.1);color:var(--red);padding:10px 14px;border-radius:8px;font-size:12px;margin-top:12px;display:none;max-width:380px}

/* ── STATS FOOTER ── */
.stats{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 24px 32px;
  padding-bottom:max(32px,env(safe-area-inset-bottom));color:rgba(255,255,255,.4)}
.stats-row{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:nowrap;
  opacity:0;animation:inStat 1.05s cubic-bezier(.16,1,.3,1) 1.1s both}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:-.01em;white-space:nowrap}
.stat+.stat::before{content:'\00B7';margin:0 12px;color:rgba(255,255,255,.25);font-size:16px;line-height:1}
.stat-icon{width:14px;height:14px;flex-shrink:0}
.stat-icon svg{width:100%;height:100%;fill:none;stroke:rgba(255,255,255,.35);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ── ANIMATIONS ── */
@keyframes inScale{0%{opacity:0;transform:scale(.84)}100%{opacity:1;transform:none}}
@keyframes inSoft{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes inMask{0%{opacity:0;transform:translateY(30%)}100%{opacity:1;transform:none}}
@keyframes inPop{0%{opacity:0;transform:scale(.9)}70%{transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes inStat{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}
  .logo,.badge,.hero h1,.call-wrap,.stat,.powered{opacity:1;transform:none}}

/* ── RESPONSIVE ── */
@media(min-width:1600px){
  .hero h1{font-size:3.5rem}
  .lede{font-size:17px;max-width:480px}
  .header{padding:28px 64px 10px}
}
@media(min-width:1920px){
  .hero h1{font-size:4rem}
  .header{padding:32px 80px 10px}
}

@media(max-width:900px){
  html,body{height:auto;overflow-y:auto;overflow-x:hidden}
  .page{min-height:100vh;min-height:100dvh}
  .header{padding:16px 20px 8px}
  .hero{padding:0 20px 40px}
  .stat{font-size:10px}
  .stat+.stat::before{margin:0 8px}
  .orb-box{width:140px;height:140px}
  .call-btn{width:88px;height:88px}
  .call-btn svg{width:36px;height:36px}
}
@media(max-width:560px){
  .hero h1{font-size:1.7rem}
  .lede{font-size:14px}
  .header{padding:14px 16px 6px}
  .logo img{height:35px}
  .logo span{font-size:13px}
  .orb-ring:nth-child(3){display:none}
}
</style>

<!-- AMBIENT BACKGROUND -->
<script>
(function(){
  var c=document.getElementById('bg'),ctx=c.getContext('2d'),w,h,pts=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;makePts()}
  function makePts(){pts.length=0;for(var i=0;i<180;i++){var bright=Math.random()<.1;pts.push({x:Math.random()*w,y:Math.random()*h,r:bright?Math.random()*2+.8:Math.random()*.8+.15,dx:(Math.random()-.5)*.1,dy:(Math.random()-.5)*.1,o:bright?Math.random()*.5+.25:Math.random()*.18+.03,tw:bright?Math.random()*3+1.5:0})}}
  resize();addEventListener('resize',resize);
  var t=0;
  function draw(){
    t+=.016;ctx.clearRect(0,0,w,h);
    // Soft radial glows — white/blue
    var g1=ctx.createRadialGradient(w*.35,h*.4,0,w*.35,h*.4,w*.45);
    g1.addColorStop(0,'rgba(255,255,255,.03)');g1.addColorStop(1,'transparent');
    ctx.fillStyle=g1;ctx.fillRect(0,0,w,h);
    var g2=ctx.createRadialGradient(w*.65,h*.6,0,w*.65,h*.6,w*.35);
    g2.addColorStop(0,'rgba(0,61,165,.04)');g2.addColorStop(1,'transparent');
    ctx.fillStyle=g2;ctx.fillRect(0,0,w,h);
    for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.dx;p.y+=p.dy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      var op=p.tw?p.o*(0.5+0.5*Math.sin(t*p.tw)):p.o;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+op+')';ctx.fill()}
    requestAnimationFrame(draw)}
  draw()
})();
</script>

<!-- ENTRANCE SOUND -->
<script>
(function(){
  var played=false;
  function playOnce(){
    if(played)return;played=true;
    document.removeEventListener('click',playOnce);
    document.removeEventListener('touchstart',playOnce);
    try{
      var ac=new(window.AudioContext||window.webkitAudioContext)();
      var now=ac.currentTime,dur=2.5;
      // Deep cinematic chord — C1, C2, G2, C3 (all low register)
      var freqs=[32.70, 65.41, 98.00, 130.81];
      var master=ac.createGain();master.gain.value=1;
      // Reverb via convolver-like delay network
      var del1=ac.createDelay();del1.delayTime.value=.08;
      var del2=ac.createDelay();del2.delayTime.value=.16;
      var fb1=ac.createGain();fb1.gain.value=.25;
      var fb2=ac.createGain();fb2.gain.value=.2;
      var wet=ac.createGain();wet.gain.value=.35;
      del1.connect(fb1);fb1.connect(del1);del1.connect(wet);
      del2.connect(fb2);fb2.connect(del2);del2.connect(wet);
      wet.connect(ac.destination);
      freqs.forEach(function(f,idx){
        var o=ac.createOscillator();o.type='sine';o.frequency.value=f;
        var g=ac.createGain();
        var vol=idx===0?.15:(idx===3?.05:.09);
        var atk=.4+idx*.15;
        g.gain.setValueAtTime(0,now);
        g.gain.linearRampToValueAtTime(vol,now+atk);
        g.gain.setValueAtTime(vol,now+atk+.3);
        g.gain.exponentialRampToValueAtTime(.001,now+dur);
        o.connect(g);g.connect(master);g.connect(del1);g.connect(del2);
        o.start(now);o.stop(now+dur+.5);
      });
      // No noise — clean tones only
      master.connect(ac.destination);master.connect(del1);
    }catch(e){}
  }
  // Auto-play on first interaction (mobile requires gesture)
  document.addEventListener('click',playOnce,{once:true});
  document.addEventListener('touchstart',playOnce,{once:true});
  // Try auto on load (works on desktop)
  setTimeout(playOnce,800);
})();
</script>

<!-- VAPI -->
<script type="module">
import VapiModule from 'https://cdn.jsdelivr.net/npm/@vapi-ai/web@2/+esm';
const VapiSDK = VapiModule.default || VapiModule;

const VAPI_PK = 'ea0f9238-a03f-476a-9628-a47cac9b31cd';
const ASST_ID = 'fc39a7f7-c91e-4f33-b3c0-718eaa7d3f11';

let vapi = null, active = false, t0 = null, ti = null;

try { vapi = new VapiSDK(VAPI_PK); } catch(e) { console.error('Vapi:', e); }

if (vapi) {
  vapi.on('call-start', () => {
    active = true; setState('active'); addMsg('system','Conectado con Mariana');
    t0 = Date.now(); ti = setInterval(tick, 1000);
    document.getElementById('orbGlow').style.background = 'radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%)';
  });
  vapi.on('call-end', () => {
    active = false; setState('idle'); addMsg('system','Llamada finalizada');
    clearInterval(ti); ti = null;
    document.getElementById('orbGlow').style.background = '';
  });
  vapi.on('speech-start', () => {
    document.getElementById('ring').className = 'ring active';
    document.getElementById('callStatus').textContent = 'Mariana esta hablando...';
    document.getElementById('callStatus').className = 'call-status active';
    document.getElementById('volFill').className = 'vol-fill speaking';
    document.getElementById('orbGlow').style.filter = 'blur(14px) brightness(1.4)';
  });
  vapi.on('speech-end', () => {
    document.getElementById('ring').className = 'ring listening';
    document.getElementById('callStatus').textContent = 'Escuchando...';
    document.getElementById('callStatus').className = 'call-status listening';
    document.getElementById('volFill').className = 'vol-fill';
    document.getElementById('orbGlow').style.filter = 'blur(10px) brightness(1)';
  });
  vapi.on('volume-level', (l) => {
    var v = Math.min(100, l * 100);
    document.getElementById('volFill').style.width = v + '%';
    var s = 1 + (l * 0.4);
    document.getElementById('orbGlow').style.transform = 'scale(' + s + ')';
  });
  vapi.on('message', (m) => {
    if (m.type === 'transcript' && m.transcriptType === 'final')
      addMsg(m.role === 'assistant' ? 'agent' : 'user', m.transcript);
  });
  vapi.on('error', (e) => {
    console.error('Vapi:', e);
    showErr('Error de conexion. Revisa tu microfono e intenta de nuevo.');
    active = false; setState('idle'); clearInterval(ti);
  });
}

window.toggleCall = function() {
  if (!vapi) { showErr('SDK no cargado. Recarga la pagina.'); return; }
  if (active) vapi.stop();
  else { setState('connecting'); vapi.start(ASST_ID); }
};

function setState(s) {
  var btn = document.getElementById('callBtn');
  var ring = document.getElementById('ring');
  var st = document.getElementById('callStatus');
  var lb = document.querySelector('.call-label');
  var mic = document.getElementById('iconMic');
  var stp = document.getElementById('iconStop');
  btn.className = 'call-btn ' + s;
  if (s === 'idle') {
    ring.className = 'ring'; lb.textContent = 'Hablar con Mariana';
    st.textContent = 'Toca para iniciar la llamada'; st.className = 'call-status';
    mic.style.display = ''; stp.style.display = 'none';
    document.getElementById('volFill').style.width = '0%';
    document.getElementById('timer').textContent = '';
  } else if (s === 'connecting') {
    ring.className = 'ring'; lb.textContent = 'Conectando...';
    st.textContent = 'Preparando llamada'; st.className = 'call-status';
  } else {
    ring.className = 'ring listening'; lb.textContent = 'En llamada';
    st.textContent = 'Escuchando...'; st.className = 'call-status listening';
    mic.style.display = 'none'; stp.style.display = '';
  }
}

function tick() {
  if (!t0) return;
  var s = Math.floor((Date.now() - t0) / 1000);
  document.getElementById('timer').textContent =
    String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function addMsg(t, x) {
  var el = document.getElementById('transcript');
  var d = document.createElement('div');
  d.className = 'msg ' + t; d.textContent = x;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

function showErr(t) {
  var e = document.getElementById('errorMsg');
  e.textContent = t; e.style.display = 'block';
  setTimeout(function(){ e.style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
